<div *ngIf="enabled" class="mb-3" [class.prefilled-field]="isPrefilled">

  <label class="form-label fw-semibold d-flex align-items-center">
    {{ q.text }}

    <!-- Pre-filled indicator badge -->
    <span *ngIf="isPrefilled"
          class="badge bg-success ms-2"
          title="This field was pre-filled from existing observations">
      <i class="bi bi-check-circle-fill"></i> Pre-filled
    </span>
  </label>

  <!-- CHOICE QUESTIONS -->
  <ng-container *ngIf="q.type === 'choice'">
    <div *ngFor="let opt of q.answerOption" class="form-check">
      <input
        type="checkbox"
        class="form-check-input"
        [id]="q.linkId + '_' + opt.valueCoding.code"
        [checked]="isChecked(opt.valueCoding.code)"
        (click)="toggleOption(opt.valueCoding.code, isExclusiveOption(opt))"
      >
      <label class="form-check-label" [for]="q.linkId + '_' + opt.valueCoding.code">
        {{ opt.valueCoding.display }}
      </label>
    </div>
  </ng-container>

  <!-- NUMERIC INPUT -->
  <div *ngIf="q.type === 'decimal' || q.type === 'integer'" class="position-relative">
    <input
      class="form-control"
      [class.is-valid]="isPrefilled"
      type="number"
      [value]="answers[q.linkId] || ''"
      (input)="onNumericChange(($any($event.target)).value)"
    >

    <!-- Visual indicator icon for pre-filled numeric fields -->
    <i *ngIf="isPrefilled"
       class="bi bi-check-circle-fill text-success position-absolute"
       style="right: 10px; top: 50%; transform: translateY(-50%);">
    </i>
  </div>
</div>
