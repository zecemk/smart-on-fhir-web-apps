<div class="vh-100 d-flex flex-column">

  <!-- HEADER (on all pages) -->
  <ui-header
    class="flex-shrink-0"
    [logoSrc]="'assets/stage-circle-white.png'"
    brandText="STAGE"
    [tabs]="[
      { label: 'Summary', link: '/summary' },
      { label: 'Risks', link: '/', active: true }
    ]">
  </ui-header>

  <!-- BODY -->
  <div class="row g-0 flex-grow-1 min-h-0">

    <!-- SIDEBAR (on all pages) -->
    <div class="col-12 col-lg-3 p-0 h-100 overflow-auto" *ngIf="patient">
      <ui-sidebar
        title="Patient Demographics"
        [rows]="sidebarRows">
      </ui-sidebar>
    </div>

    <!-- MAIN CONTENT (router-outlet) -->
    <div [ngClass]="patient ? 'col-12 col-lg-9' : 'col-12'" class="p-4 h-100 overflow-auto">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
