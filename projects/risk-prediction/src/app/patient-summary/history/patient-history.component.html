<div class="card mb-3">
  <!-- Header -->
  <div class="card-header d-flex align-items-center justify-content-between">
    <h5 class="mb-0">Patient History</h5>
    <button
      type="button"
      class="btn btn-sm btn-outline-primary history-settings-btn d-flex align-items-center gap-1"
      (click)="openSettings()">
      <i class="bi bi-gear"></i>
      <span>Settings</span>
    </button>
  </div>

  <!-- Body -->
  <div class="card-body p-3">

    <!-- Empty state -->
    <div *ngIf="!loading && !filtered?.length" class="alert alert-secondary mb-0">
      No history selected.
      <button type="button" class="btn btn-link p-0 align-baseline" (click)="openSettings()">
        Open History Settings
      </button>
    </div>

    <!-- Timeline -->
    <div *ngIf="!loading && filtered?.length" class="history-wrapper overflow-auto py-3">
      <!-- horizontal baseline (behind nodes) -->
      <div class="history-line"></div>

      <!-- items -->
      <div class="d-flex gap-4">
        <div
          *ngFor="let e of filtered"
          class="text-center flex-shrink-0"
          style="width: 160px;"
          [attr.data-kind]="e.kind">

          <!-- medallion (no text inside) -->
          <div
            class="history-node mb-2 d-flex align-items-center justify-content-center"
            [ngClass]="{
              'bg-success-subtle text-success': e.kind === 'condition',
              'bg-info-subtle text-info-emphasis': e.kind === 'lifestyle' || e.kind === 'derived',
              'bg-secondary-subtle text-secondary': e.kind === 'medication'
            }">
            <i [class]="'bi ' + getIconClass(e.iconKey) + ' fs-3'"></i>
          </div>

          <!-- stem to the baseline -->
          <div class="history-connector"></div>

          <!-- label + date -->
          <div class="fw-semibold text-truncate" [title]="e.title">{{ e.title }}</div>
          <div class="text-muted small">
            {{ e.date | date:'dd/MM/yyyy' }}
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Settings modal -->
<ms-history-settings
  *ngIf="settingsOpen"
  [value]="settings"
  (save)="onSettingsSave($event)"
  (cancel)="closeSettings()">
</ms-history-settings>
