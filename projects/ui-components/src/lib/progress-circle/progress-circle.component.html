<svg [attr.width]="width" [attr.height]="height" viewBox="0 0 250 250" class="circular-progress" [style]="{ '--progress': progress }">
  <circle class="bg" [style]="{ stroke: backgroundColor }"></circle>
  <circle class="fg" [style]="{ stroke: color }"></circle>
  <text
    x="125"
    y="125"
    text-anchor="middle"
    dominant-baseline="central"
    font-size="80"
    [attr.fill]="color">
    {{ (progress | number:'1.0-0') + '%' }}
  </text>
</svg>
