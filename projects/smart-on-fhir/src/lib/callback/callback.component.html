<div class="w-100 h-100 position-fixed bg-light" style="line-height: 100vh; text-align: center">
  @if (!error) {
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Processing Authorization...
  } @else {
    <div style="display: inline-block; line-height: 2em">
      <i class="fs-1 text-danger bi bi-exclamation-triangle-fill"></i>
      <p>{{error}}</p>
    </div>
  }
</div>
